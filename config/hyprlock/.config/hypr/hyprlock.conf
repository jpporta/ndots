background {
  monitor=DP-1
  color=rgba(1d202144)
}

general {
  hide_cursor=true
  ignore_empty_input=true
}

input-field {
  monitor=DP-1
  size=300, 54
  capslock_color=rgb(fabd2f)
  check_color=rgb(b8bb26)
  dots_center=true
  dots_size=0.250000
  dots_spacing=0.300000
  fade_on_empty=false
  fail_color=rgb(fb4934)
  fail_text=<span foreground="##fb4934"><i>$FAIL ($ATTEMPTS)</i></span>
  font_color=rgb(ebdbb2)
  halign=center
  inner_color=rgb(3c3836)
  outer_color=rgb(fe8019)
  outline_thickness=2
  placeholder_text=<span foreground="##928374"><i>󰌾  Enter password</i></span>
  position=0, -95
  rounding=14
  valign=center
}

label {
  monitor=DP-1
  color=rgb(ebdbb2)
  font_family=BerkeleyMono Nerd Font Mono
  font_size=96
  halign=center
  position=0, 120
  text=$TIME
  valign=center
}

label {
  monitor=DP-1
  color=rgb(928374)
  font_family=BerkeleyMono Nerd Font Mono
  font_size=18
  halign=center
  position=0, 48
  text=cmd[update:60000] date +"%A, %d %B"
  valign=center
}

label {
  monitor=DP-1
  color=rgb(fe8019)
  font_family=BerkeleyMono Nerd Font Mono
  font_size=16
  halign=center
  position=0, -20
  text=Hey, $USER
  valign=center
}
