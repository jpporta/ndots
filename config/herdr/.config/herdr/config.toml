onboarding = false
[theme]
name = "terminal"
auto_switch = false

[keys]
# tmux-style muscle memory
split_vertical = "prefix+%"        # tmux: side-by-side split (herdr "split right")
split_horizontal = 'prefix+"'      # tmux: stacked split   (herdr "split down")
# workspace switching
next_workspace = "prefix+s"           # jump to next workspace, no menu
previous_workspace = "prefix+shift+s" # jump to previous workspace
settings = "prefix+comma"             # moved off prefix+s

# space picker (like tmux prefix+s) — shows workspaces, not panes
workspace_picker = "prefix+g"
goto = "prefix+a"

# Navigate mode (picker/workspace movement) with vim keys
navigate_workspace_up   = "k"
navigate_workspace_down = "j"

# vim-style direct pane focus (no prefix)
# WARNING: in most terminals ctrl+h == Backspace and ctrl+j == Enter/LF,
# so these can shadow Backspace/Enter inside panes. Test before relying on it.
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
pane_gaps = false
accent = "#fe8019"

[experimental]
pane_history = false
kitty_graphics = true
