[font]
size = 11

[font.bold]
family = "BerkeleyMono Nerd Font Mono"
style = "ExtraBold"

[font.bold_italic]
family = "BerkeleyMono Nerd Font Mono"
style = "ExtraBold Oblique"

[font.italic]
family = "BerkeleyMono Nerd Font Mono"
style = "Oblique"

[font.normal]
family = "BerkeleyMono Nerd Font Mono"
style = "Regular"

[window]
blur = false
decorations = "None"
dynamic_padding = true
opacity = 0.8

[window.padding]
x = 10
y = 16
